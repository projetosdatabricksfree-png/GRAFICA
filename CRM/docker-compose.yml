services:
  # 1. Banco de Dados PostgreSQL 17
  db:
    image: postgres:17-alpine
    container_name: crm-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

  # 2. Backend REST API (.NET 10 Web API - executa migrations e seed no startup)
  api:
    build:
      context: .
      dockerfile: src/Crm.Api/Dockerfile
    container_name: crm-api
    restart: always
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${ConnectionStrings__Default}
    ports:
      - "${API_PORT:-5100}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network

  # 3. Frontend Blazor Server (MudBlazor UI)
  web:
    build:
      context: .
      dockerfile: src/Crm.Web/Dockerfile
    container_name: crm-web
    restart: always
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${ConnectionStrings__Default}
    ports:
      - "${WEB_PORT:-5000}:8080"
    depends_on:
      - api
    networks:
      - crm_network

  # 5. Ferramenta de Admin PGAdmin (apenas profile dev)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-pgadmin
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inprima.com.br
      PGADMIN_DEFAULT_PASSWORD: admin_inprima_2026
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - crm_network

volumes:
  crm_pgdata:
    name: crm_pgdata

networks:
  crm_network:
    name: crm_network
    driver: bridge
