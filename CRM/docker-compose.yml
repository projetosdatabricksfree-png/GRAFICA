services:
  # 1. Banco de Dados PostgreSQL 17
  db:
    image: postgres:17-alpine
    container_name: crm-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

  # 2. Migrador Automático (Executa migrations e seed no startup)
  migrator:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: crm-migrator
    working_dir: /src
    volumes:
      - .:/src
    env_file:
      - .env
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    command: >
      sh -c "dotnet tool restore || dotnet tool install --global dotnet-ef || true
             export PATH=\"$$PATH:/root/.dotnet/tools\"
             dotnet ef database update --project src/Crm.Infrastructure --startup-project src/Crm.Api"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network

  # 3. Backend REST API
  api:
    build:
      context: .
      dockerfile: src/Crm.Api/Dockerfile
    container_name: crm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${ConnectionStrings__Default}
    ports:
      - "${API_PORT:-5100}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - crm_network

  # 4. Frontend Blazor Server (MudBlazor UI)
  web:
    build:
      context: .
      dockerfile: src/Crm.Web/Dockerfile
    container_name: crm-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${ConnectionStrings__Default}
    ports:
      - "${WEB_PORT:-5000}:8080"
    depends_on:
      - api
    networks:
      - crm_network

  # 5. Ferramenta de Admin PGAdmin (apenas profile dev)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm-pgadmin
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inprima.com.br
      PGADMIN_DEFAULT_PASSWORD: admin_inprima_2026
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - crm_network

volumes:
  crm_pgdata:
    name: crm_pgdata

networks:
  crm_network:
    name: crm_network
    driver: bridge
