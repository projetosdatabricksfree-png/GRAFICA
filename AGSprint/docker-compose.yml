version: "3"

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: agsprint-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - db
    networks:
      - sonarnet

  db:
    image: postgres:15
    container_name: agsprint-sonarqube-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - sonarnet

  ags-db:
    image: postgres:16
    container_name: agsprint-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ags_user
      - POSTGRES_PASSWORD=ags_pass
      - POSTGRES_DB=ags_db
    ports:
      - "5433:5432"
    volumes:
      - ags_postgresql_data:/var/lib/postgresql/data
      - ./database/postgrees:/docker-entrypoint-initdb.d
    networks:
      - agsnet

networks:
  sonarnet:
    driver: bridge
  agsnet:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data:
  ags_postgresql_data:
